<! DOCTYPE html>
    <html>

    <head>
        <title>webdev</title>
    </head>

    <body>
        <h2>Image tag</h2>
        <img src="https://images.pexels.com/photos/38167588/pexels-photo-38167588.jpeg" alt="image" height="200px"
            width="200px">
        <hr>
        <h2>Video embeded</h2>
        <iframe width="300" height="300" src="https://www.youtube.com/embed/QbUCVjPHzo8"
            title="Training With Coach | Ep.14 @YashSharmaFitness  " frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        <hr>
        <h2>video tag</h2>
        <video controls autoplay loop height="300px" width="300px">
            <source src="https://www.pexels.com/download/video/8675554/" type="video/mp4">

        </video>
        <hr>
        <h2>audio tag</h2>
        <audio controls height="100px" width="100px">
            <source src="audiocopper-dark-571483.mp3" type="audio/mp3">
        </audio>

    </body>

    </html>
