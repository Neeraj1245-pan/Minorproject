<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label>username:</label>
    <input type="text" placeholder="enter name">
    <br>

    <label>Emailid:</label>
    <input type="email" placeholder="Enter email">
    <br>


    <label>Password:</label>
    <input type="password" placeholder="enter pass">
    <br>


    <label>Mobile Number</label>
    <input type="tel" placeholder="enter numb">
    <br>
    
    <label>file:</label>
    <input type="file"  placeholder="enter the file here">
     <br>

     <label>DOB:</label>
     <input type="date"  placeholder="enter DOB">

     <br>
     <label>Age/price</label>
     <input type="number" placeholder="enter">
     <br>

     <label>Checkbox:</label>
     <input type="checkbox" placeholder="check">

     <br>
     <label>range:</label>
     <input type="range" placeholder="range" min="2" max="100" step="1">


     <br>
     <label>Url</label>
     <input type="url">
</body>
</html>
